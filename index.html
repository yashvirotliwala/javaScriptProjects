</head>

<body class="d-flex justify-content-center align-items-center">
    <div id="particles-js"></div>


    <div class="card text-bg-light mb-3" style="max-width: 30vw;">
        <div class="card-header mb-2 fs-3 fw-bold text-center">Java-script Projects</div>
        <div class="card-body d-flex flex-wrap">
            <div class="row">
                <div class="col-lg-6 col-12">
                    <button class="btn-bg border-0 mb-4 p-2 rounded-1"><a class="color text-decoration-none"

                    <button class="btn-bg border-0 mb-4 p-2 rounded-1"><a class="color text-decoration-none"
                            href="./project-4/index.html">Project-4 <br><span class="java">Shooping slider</span>
                        </a></button>
                    <button class="btn-bg border-0 mb-4 p-2 rounded-1"><a class="color text-decoration-none"
                            href="./project-5/index.html">Project-5 <br><span class="java">Quiz task</span>
                        </a></button>
                </div>
                <div class="col-lg-6 col-12">
                    <button class="btn-bg border-0 mb-4 p-2 rounded-1"><a class="color text-decoration-none">Project-6

                    <button class="btn-bg border-0 mb-4 p-2 rounded-1"><a class="color text-decoration-none">Project-7
                            <br><span class="java">Soon</span></a></button>
                    <button class="btn-bg border-0 mb-4 p-2 rounded-1"><a class="color text-decoration-none">Project-8
                            <br><span class="java">Soon</span></a></button>
                    <button class="btn-bg border-0 mb-4 p-2 rounded-1"><a class="color text-decoration-none">Project-9
                            <br><span class="java">Soon</span></a></button>
                    <button class="btn-bg border-0 mb-4 p-2 rounded-1"><a class="color text-decoration-none">Project-10
                            <br><span class="java">Soon</span> </a></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="http://threejs.org/examples/js/libs/stats.min.js"></script>
    <script src="./assests/js/bootstrap.bundle.min.js"></script>

    <script>
        particlesJS("particles-js", {
            particles: {
                number: { value: 6, density: { enable: true, value_area: 800 } },
                color: { value: "#1b1e34" },
                shape: {
                    type: "circle",
                    stroke: { width: 0, color: "#000" },
                    polygon: { nb_sides: 6 },
                    image: { src: "img/github.svg", width: 100, height: 100 }
                },
                opacity: {
                    value: 0.3,
                    random: true,
                    anim: { enable: false, speed: 1, opacity_min: 0.1, sync: false }
                },
                size: {
                    value: 160,
                    random: false,
                    anim: { enable: true, speed: 10, size_min: 40, sync: false }
                },
                line_linked: {
                    enable: false,
                    distance: 200,
                    color: "#ffffff",
                    opacity: 1,
                    width: 2
                },
                move: {
                    enable: true,
                    speed: 8,
                    direction: "none",
                    random: false,
                    straight: false,
                    out_mode: "out",
                    bounce: false,
                    attract: { enable: false, rotateX: 600, rotateY: 1200 }
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: false, mode: "grab" },
                    onclick: { enable: false, mode: "push" },
                    resize: true
                },
                modes: {
                    grab: { distance: 400, line_linked: { opacity: 1 } },
                    bubble: { distance: 400, size: 40, duration: 2, opacity: 8, speed: 3 },
                    repulse: { distance: 200, duration: 0.4 },
                    push: { particles_nb: 4 },
                    remove: { particles_nb: 2 }
                }
            },
            retina_detect: true
        });
        var count_particles, stats, update;
        stats = new Stats();
        stats.setMode(0);
        stats.domElement.style.position = "absolute";
        stats.domElement.style.left = "0px";
        stats.domElement.style.top = "0px";
        document.body.appendChild(stats.domElement);
        count_particles = document.querySelector(".js-count-particles");
        update = function () {
            stats.begin();
            stats.end();
            if (window.pJSDom[0].pJS.particles && window.pJSDom[0].pJS.particles.array) {
                count_particles.innerText = window.pJSDom[0].pJS.particles.array.length;
            }
            requestAnimationFrame(update);
        };
        requestAnimationFrame(update);
    </script>
</body>

</html>
