<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales Quiz</title>

    <!-- Bootstrap CSS -->
    <link href="./assests/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./assests/css/style.css">

</head>

<body class="d-flex justify-content-center align-items-center vh-100">

    <!-- WELCOME CARD -->

    <div class="card shadow p-4 text-center" id="welcome" style="width:650px; background:#e7d3bb;">

        <h1 class="fw-bold welcome">Welcome To</h1>

        <h2 class="mb-3 sub-title">Sales Knowledge Quiz</h2>

        <p class="fs-5">Enter your name to start quiz :</p>

        <input type="text" id="username" class="form-control w-75 mx-auto" placeholder="Enter your name">

        <br>
        <div class="d-flex justify-content-center">
            <button class="btn start-btn w-50 mt-3" onclick="startQuiz()">NEXT</button>
        </div>

    </div>

    <!-- COUNTDOWN CARD -->

    <div class="card" id="countdownCard" style="display:none;">

        <h1 id="countNumber">3</h1>

        <p>Quiz starting...</p>

    </div>


    <!-- QUIZ CARD -->

    <div class="card shadow p-4" id="quiz" style="width:650px; background:#e7d3bb; display:none;">

        <!-- Header -->

        <div class="d-flex justify-content-between align-items-center mb-3">

            <div class="fs-4" style="cursor:pointer;" onclick="goHome()">✕</div>

            <div class="text-danger fw-bold">
                ⏱ <span id="time">60</span>s
            </div>

        </div>


        <h1 class="text-center fw-bold sub-title">Sales Knowledge Quiz</h1>

        <h5 class="text-center mt-2">Hello, <span id="displayName"></span></h5>

        <hr>

        <h3 id="question"></h3>

        <div id="options"></div>

        <div class="d-flex justify-content-center">
            <button class="start-btn w-50 mt-3" onclick="nextQuestion()">NEXT</button>
        </div>

    </div>

    <!-- SCORE CARD -->

    <div class="card shadow p-4 text-center result-card" id="resultCard" style="width:650px; display:none;">

        <h2 class="result-title">Quiz Completed 🎉</h2>

        <p class="result-user" id="resultName"></p>

        <div class="score-box">
            <span class="score-number" id="finalScore"></span>
            <span class="score-text">Score</span>
        </div>

        <p class="result-message" id="resultMessage"></p>

        <div class="d-flex justify-content-center mt-3">
            <button id="restartBtn" onclick="restartQuiz()">Restart Quiz</button>
        </div>

    </div>


    <script src="./assests/js/script.js"></script>

</body>

</html>
