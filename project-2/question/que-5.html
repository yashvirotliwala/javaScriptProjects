<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>que-2</title>
</head>

<body>
    <h1>Factors of a Number</h1>
    <h2 id="num"></h2>

    <script>
        let num = Number(prompt("Enter a number: "));

        document.write("Factors of " + num + " are: ");

        for (let i = 1; i <= num; i++) {
            if (num % i === 0) {    
                document.write(i + " ");
            }
        }
    </script>

</body>

</html>
