<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>que-2</title>
</head>

<body>
    <h1>prime number</h1>
    <h2 id="start"></h2>
    <h2 id="end"></h2>

    <script>

        let start = Number(prompt("Enter start of range: "));
        let end = Number(prompt("Enter end of range: "));

        for (let i = start; i <= end; i++) {
            if (i < 2) continue;

            let isPrime = true;

            for (let j = 2; j <= i / 2; j++) {
                if (i % j === 0) {
                    isPrime = false;
                    break;
                }
            }

            if (isPrime) {
                document.write(i + " ");
            }
        }

    </script>

</body>

</html>
