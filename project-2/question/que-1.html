<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>que-1</title>
</head>
<body>
    <h1>Leap Year</h1>
    <h2 id="start"></h2>
    <h2 id="end"></h2>
    <h2 id="leap"></h2>

    <script>
        let startYear = Number(prompt("Enter the starting year : "));
        let endYear = Number(prompt("Enter the ending year : "));
        let leapYear = "";
        
        document.getElementById("start").innerHTML = "Starting year : " + startYear;
        document.getElementById("end").innerHTML = "Ending year : " + endYear;
        if (startYear < endYear) {
            for(let i = startYear ; i <= endYear ; i++){
                if ((i % 4 == 0 && i % 100 != 0) || (i % 400 == 0)) {
                    leapYear = leapYear + i + " ";
                }
            }
        }
        document.getElementById("leap").innerHTML = "Leap Year : " + leapYear;
    </script>

</body>
</html>
