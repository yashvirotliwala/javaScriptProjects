<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>que-2</title>
</head>
<body>
    <h1>Multiplication table</h1>
    <h2 id="num"></h2>
    <h2 id="result"></h2>

    <script>
        let num = Number(prompt("enter any number : "));
        let table = "";

        document.getElementById("num").innerHTML = "table of : " + num;

        for(let i = 1;i <= 10;i++) {
            table = num*i;
            document.getElementById("result").innerHTML += num + "X" + i + "=" + table + "<br>";
        }

    </script>

</body>
</html>
