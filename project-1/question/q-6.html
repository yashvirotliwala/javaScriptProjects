<!-- fahrenheit = (celsius * 9.0 / 5.0) + 32 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>q-2</title>
</head>
<body>
    <h1 id="fah"></h1>
    <h3 id="cel"></h3>

    <script>
        let celsius= Number(prompt("Enter celcius : "));
        
        let fahrenheit = (celsius * 9.0 / 5.0) + 32;

        document.getElementById("cel").innerHTML = "Celcius : " + celsius;
        
        document.getElementById("fah").innerHTML = "Fahrenheit : " + fahrenheit;
    </script>
</body>
</html>
