<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>q-3</title>
</head>
<body>
    <h1 id="s1"></h1>
    <h3 id="s2"></h3>
    <h3 id="s3"></h3>
    <h3 id="s4"></h3>
    <h3 id="s5"></h3>
    <h3 id="total"></h3>
    <h3 id="percentage"></h3>

    <script>
        let s1 = Number(prompt("Enter first subject marks: "));
        let s2 = Number(prompt("Enter second subject marks: "));
        let s3 = Number(prompt("Enter third subject marks : "));
        let s4 = Number(prompt("Enter fourth subject marks : "));
        let s5 = Number(prompt("Enter fifth subject marks : "));

        let total = s1 + s2 + s3 + s4 + s5;
        let percentage = total / 500 * 100;

        document.getElementById("s1").innerHTML = "First subject : " + s1;
        document.getElementById("s2").innerHTML = "Second subject : " + s2;
        document.getElementById("s3").innerHTML = "Third subject : " + s3;
        document.getElementById("s4").innerHTML = "Fourth subject : " + s4;
        document.getElementById("s5").innerHTML = "Fifth subject : " + s5;
        
        document.getElementById("total").innerHTML = "Total Marks : " + total;
        document.getElementById("percentage").innerHTML = "Percentage of Marks : " + percentage + "%";
    </script>
</body>
</html>
